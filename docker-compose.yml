name: wallygrow

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wallygrow}
      MYSQL_USER: ${DB_USER:-wallygrow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wallygrow_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8082}:80"
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST:-db}
      WORDPRESS_DB_NAME: ${DB_NAME:-wallygrow}
      WORDPRESS_DB_USER: ${DB_USER:-wallygrow}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wallygrow_secret}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/themes/wally-grow-child

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8083}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-wallygrow}
      PMA_PASSWORD: ${DB_PASSWORD:-wallygrow_secret}

volumes:
  db_data:
  wp_data:
